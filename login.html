<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SafePass - Autenticación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow-lg p-4 bg-white border-0" style="width: 100%; max-width: 400px; border-radius: 14px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark mb-0">SafePass</h3>
            <p class="text-muted small">Control de Accesos - Selección de Operador</p>
        </div>

        {% if error %}
        <div class="alert alert-danger text-center small fw-bold py-2" role="alert">
             {{ error }}
        </div>
        {% endif %}

        <form action="/login-auth" method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Seleccione su Rol:</label>
                <select class="form-select fw-bold" name="rol" id="select-rol" onchange="evaluarCampos()">
                    <option value="User">User </option>
                    <option value="Supervisor">Supervisor </option>
                    <option value="Admin">Admin </option>
                    <option value="Superadmin">Superadmin </option>
                </select>
            </div>

            <!-- Campo dinámico para Cédula (Solo se muestra a USER) -->

            <div class="mb-4 d-none" id="grupo-cedula-user">
                <label class="form-label text-primary small fw-bold">Número de Cédula:</label>
                <input type="text" class="form-control text-center fw-bold text-dark fs-5" name="cedula_user" id="input-cedula-user" placeholder="Escriba su cédula aquí">
            </div>

            <!-- Campo dinámico para Contraseña (Se muestra a Admin y Superadmin) -->

            <div class="mb-4 d-none" id="grupo-password">
                <label class="form-label text-danger small fw-bold">Contraseña de Seguridad:</label>
                <input type="password" class="form-control text-center fw-bold text-secondary" name="password" id="input-pass" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">Iniciar Sesión</button>
        </form>
    </div>

<script>
    function evaluarCampos() {
        const rol = document.getElementById('select-rol').value;
        const grupoPass = document.getElementById('grupo-password');
        const inputPass = document.getElementById('input-pass');
        const grupoCedula = document.getElementById('grupo-cedula-user');
        const inputCedula = document.getElementById('input-cedula-user');

        // Resetear requeridos y ocultar todo primero

        grupoPass.classList.add('d-none');
        inputPass.required = false;
        inputPass.value = '';

        grupoCedula.classList.add('d-none');
        inputCedula.required = false;
        inputCedula.value = '';

        if (rol === 'Superadmin' || rol === 'Admin' || rol === 'Supervisor') {
            grupoPass.classList.remove('d-none'); // Muestra campo de contraseña
            inputPass.required = true;
        } else if (rol === 'User') {
            grupoCedula.classList.remove('d-none'); // Muestra campo de cédula
            inputCedula.required = true;
        }
    }
    // Ejecutar al cargar la página por si se quedó seleccionado algún rol
    evaluarCampos();
</script>
</body>
</html>
