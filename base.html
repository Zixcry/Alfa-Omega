<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePass - Control de Accesos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .progress { height: 25px; border-radius: 8px; font-weight: bold; }
        .card { border-radius: 12px; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="/">SafePass Control</a>
            <div class="navbar-nav ms-auto">
            <a class="nav-link active fw-semibold" href="/dashboard">Dashboard</a>
            <a class="nav-link text-danger fw-semibold" href="{{ url_for('login') }}">Salir</a>
        </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
</html>
